title: ProcDump Creating a Memory Dump of LSASS
id: c3df17e2-22d4-4473-9298-5910a5f92906
status: experimental
description: |
  Flags ProcDump (including renamed copies, via OriginalFileName) dumping LSASS by name,
  or taking a full memory dump (-ma) of any process. Attackers often pass the LSASS PID
  instead of its name, so the -ma branch catches that case at the cost of more noise.
author: Nikhith
date: 2026-11-23
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith:
        - '\procdump.exe'
        - '\procdump64.exe'
        - '\procdump64a.exe'
    - OriginalFileName: 'procdump'
  selection_target_lsass:
    CommandLine|contains: 'lsass'
  selection_target_fulldump:
    CommandLine|windash|contains: ' -ma '
  condition: selection_img and 1 of selection_target_*
falsepositives:
  - Authorized incident response or application debugging with full dumps
level: high
tags:
  - attack.credential_access
  - attack.t1003.001
